[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubik-cube-solver"
version = "0.0.5"
authors = [
    { name = "Ognian Baruh", email = "ognian@baruh.net" }
]
description = "A Rubik's Cube solver and scrambler."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Puzzle Games"
]

[project.urls]
Homepage = "https://github.com/ogi02/Rubik-s-Cube-Solver"
Issues = "https://github.com/ogi02/Rubik-s-Cube-Solver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The test tree mirrors the source packages, so `cube_2x2/` and `cube_3x3/` each hold an
# `oll_test.py` and a `pll_test.py`. Test directories carry no `__init__.py`, so the default import
# mode would give those files the same module name and refuse to collect the second one.
addopts = "--import-mode=importlib"

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.py$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
